<div class="intro"><small>EXPLORE SAMPLE JOBS</small>
    <h1>Find your next direction.</h1>
    <p>These five jobs are fictional examples.</p>
</div>
<form class="panel filters" method="get" action="/jobs">
    <div><label for="q">Search title, company or skill</label><input id="q" name="q" value="$query" type="search"></div>
    <div><label for="location">Location</label><select id="location" name="location">$locations</select></div>
    <div><label for="sort">Sort</label><select id="sort" name="sort">$sort_options</select></div><button>Search
        jobs</button>
</form>
<p class="note">$profile</p>
<form action="/skills/clear" method="post"><input type="hidden" name="csrf" value="$csrf"><button
        class="secondary">Clear detected skills</button></form>
<p role="status">$count sample jobs found.</p>
<div class="three">$jobs</div>
